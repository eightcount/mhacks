<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Caterer Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
    </svg>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
        <h1 class="brand-name" id="business-name"></h1>
      </div>
      <div class="refresh" id="refresh-area" hidden>
        <span class="updated"><span id="today-label"></span><span id="updated-at" aria-live="polite"></span></span>
        <button class="button" id="refresh-button" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg><span class="button-text">Refresh</span>
        </button>
      </div>
    </header>

    <main class="page">
      <div class="notice" id="notice" role="alert" hidden>
        <p class="notice-title" id="notice-title"></p>
        <p class="notice-body" id="notice-body"></p>
      </div>

      <div class="dashboard" id="dashboard" hidden>
        <div class="month-bar">
          <div class="month-nav">
            <button class="month-step" id="month-prev" type="button" aria-label="Previous month">
              <svg class="icon" aria-hidden="true"><use href="#i-left" /></svg>
            </button>
            <h2 class="month-title" id="month-heading" aria-live="polite"></h2>
            <button class="month-step" id="month-next" type="button" aria-label="Next month">
              <svg class="icon" aria-hidden="true"><use href="#i-right" /></svg>
            </button>
          </div>
          <button class="button-outline" id="month-current" type="button" hidden>This month</button>
        </div>

        <nav class="stats" aria-labelledby="month-heading">
          <a class="stat" href="#revenue" data-view="revenue">
            <span class="stat-label">Revenue</span>
            <span class="stat-value" id="revenue-total">–</span>
            <span class="stat-sub" id="revenue-sub"></span>
            <span class="stat-sub" id="revenue-preorders"></span>
          </a>
          <a class="stat" href="#orders" data-view="orders">
            <span class="stat-label">Orders to fill</span>
            <span class="stat-value" id="orders-to-fill">–</span>
            <span class="stat-sub" id="orders-sub"></span>
          </a>
          <a class="stat" href="#awaiting" data-view="awaiting">
            <span class="stat-label">Awaiting your reply</span>
            <span class="stat-value" id="awaiting-total">–</span>
            <span class="stat-sub" id="awaiting-sub"></span>
          </a>
          <a class="stat" href="#customers" data-view="customers">
            <span class="stat-label">Customers</span>
            <span class="stat-value" id="customers-total">–</span>
            <span class="stat-sub" id="customers-sub"></span>
          </a>
        </nav>

        <div class="view" id="home-view">
          <div class="columns">
            <section aria-labelledby="upcoming-heading">
              <div class="section-head">
                <h2 class="section-title" id="upcoming-heading">Upcoming</h2>
                <span class="section-note">Accepted orders</span>
              </div>
              <div class="panel">
                <ul class="rows scroll-list" id="upcoming-list" tabindex="0" aria-labelledby="upcoming-heading"></ul>
              </div>
            </section>

            <section aria-labelledby="requests-heading">
              <div class="section-head">
                <h2 class="section-title" id="requests-heading">Pending requests</h2>
                <span class="badge" id="requests-count">0</span>
              </div>
              <div class="panel">
                <ul class="rows scroll-list" id="request-list" tabindex="0" aria-labelledby="requests-heading"></ul>
              </div>
            </section>
          </div>

          <section aria-labelledby="menu-heading">
            <div class="section-head">
              <h2 class="section-title" id="menu-heading">Menu for the week</h2>
              <span class="section-note" id="menu-range"></span>
            </div>
            <ol class="menu" id="menu-list" aria-labelledby="menu-heading"></ol>
          </section>
        </div>

        <section class="view detail" id="detail-view" aria-labelledby="detail-title" hidden>
          <div class="detail-head">
            <a class="back-link" href="#home">
              <svg class="icon" aria-hidden="true"><use href="#i-left" /></svg>Dashboard
            </a>
            <h2 class="detail-title" id="detail-title"></h2>
          </div>
          <div id="detail-body"></div>
        </section>
      </div>
    </main>

    <footer class="footer" id="footer" hidden>
      <p>Updates automatically every 30 seconds</p>
    </footer>
  </body>
</html>
