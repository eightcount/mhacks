<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dishpatch</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%23f0482f'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M9.5 20.5h17M11.5 20.5a7.5 7.5 0 0 1 15 0M19 11.5v1.5M5.5 17h4M7.5 13.5h3.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <!--
      One line-icon family: a 24px grid, a 2px stroke with round caps and joins,
      and no fills. Color comes from currentColor, set by the tile around it.
    -->
    <svg xmlns="http://www.w3.org/2000/svg" hidden>
      <symbol id="i-dishpatch" viewBox="0 0 24 24">
        <path d="M6 16.75h15.5" />
        <path d="M7.5 16.75a6.25 6.25 0 0 1 12.5 0" />
        <path d="M13.75 10.5V8.5" />
        <path d="M2.5 13.75h3" />
        <path d="M4.25 10.75h2.5" />
      </symbol>
      <symbol id="i-dollar" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" />
        <path d="M12 18V6" />
      </symbol>
      <symbol id="i-chef" viewBox="0 0 24 24">
        <path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z" />
        <path d="M6 17h12" />
      </symbol>
      <symbol id="i-chat" viewBox="0 0 24 24">
        <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
        <path d="M8 12h.01" />
        <path d="M12 12h.01" />
        <path d="M16 12h.01" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <path d="M8 2v4" />
        <path d="M16 2v4" />
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <path d="M3 10h18" />
        <path d="m9 16 2 2 4-4" />
      </symbol>
      <symbol id="i-utensils" viewBox="0 0 24 24">
        <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2" />
        <path d="M7 2v20" />
        <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7" />
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></symbol>
    </svg>

    <header class="masthead">
      <div class="topbar">
        <div class="brand">
          <span class="logo">
            <span class="logo-mark" aria-hidden="true"><svg class="icon"><use href="#i-dishpatch" /></svg></span>
            <span class="logo-word">Dishpatch</span>
          </span>
          <span class="brand-divider" id="brand-divider" aria-hidden="true" hidden></span>
          <span class="brand-mark" id="brand-mark" aria-hidden="true" hidden></span>
          <h1 class="brand-name" id="business-name"></h1>
        </div>
        <div class="refresh" id="refresh-area" hidden>
          <span class="updated"><span id="today-label"></span><span id="updated-at" aria-live="polite"></span></span>
          <button class="button" id="refresh-button" type="button">
            <svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg><span class="button-text">Refresh</span>
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="notice" id="notice" role="alert" hidden>
        <p class="notice-title" id="notice-title"></p>
        <p class="notice-body" id="notice-body"></p>
      </div>

      <div class="skeleton" id="skeleton" aria-hidden="true">
        <div class="sk sk-month"></div>
        <div class="sk-tiles">
          <div class="sk sk-tile"></div>
          <div class="sk sk-tile"></div>
          <div class="sk sk-tile"></div>
          <div class="sk sk-tile"></div>
        </div>
        <div class="sk-columns">
          <div class="sk sk-panel"></div>
          <div class="sk sk-panel"></div>
        </div>
      </div>

      <div class="dashboard" id="dashboard" hidden>
        <div class="month-bar">
          <div class="month-nav">
            <button class="month-step" id="month-prev" type="button" aria-label="Previous month">
              <svg class="icon" aria-hidden="true"><use href="#i-left" /></svg>
            </button>
            <h2 class="month-title" id="month-heading" aria-live="polite"></h2>
            <button class="month-step" id="month-next" type="button" aria-label="Next month">
              <svg class="icon" aria-hidden="true"><use href="#i-right" /></svg>
            </button>
          </div>
        </div>

        <!-- Each tile's tone colors its icon and carries into its detail view. -->
        <nav class="stats" aria-labelledby="month-heading">
          <a class="stat" href="#revenue" data-view="revenue" data-tone="basil">
            <span class="stat-head">
              <span class="well" aria-hidden="true"><svg class="icon"><use href="#i-dollar" /></svg></span>
              <span class="stat-label">Revenue</span>
            </span>
            <span class="stat-value" id="revenue-total">–</span>
            <span class="stat-sub" id="revenue-sub"></span>
            <span class="stat-sub" id="revenue-preorders"></span>
          </a>
          <a class="stat" href="#orders" data-view="orders" data-tone="tomato">
            <span class="stat-head">
              <span class="well" aria-hidden="true"><svg class="icon"><use href="#i-chef" /></svg></span>
              <span class="stat-label">Orders to fill</span>
            </span>
            <span class="stat-value" id="orders-to-fill">–</span>
            <span class="stat-sub" id="orders-sub"></span>
          </a>
          <a class="stat" href="#awaiting" data-view="awaiting" data-tone="saffron">
            <span class="stat-head">
              <span class="well" aria-hidden="true"><svg class="icon"><use href="#i-chat" /></svg></span>
              <span class="stat-label">Awaiting your reply</span>
            </span>
            <span class="stat-value" id="awaiting-total">–</span>
            <span class="stat-sub" id="awaiting-sub"></span>
          </a>
          <a class="stat" href="#customers" data-view="customers" data-tone="blueberry">
            <span class="stat-head">
              <span class="well" aria-hidden="true"><svg class="icon"><use href="#i-users" /></svg></span>
              <span class="stat-label">Customers</span>
            </span>
            <span class="stat-value" id="customers-total">–</span>
            <span class="stat-sub" id="customers-sub"></span>
          </a>
        </nav>

        <div class="view" id="home-view">
          <div class="columns">
            <section aria-labelledby="upcoming-heading" data-tone="tomato">
              <div class="section-head">
                <h2 class="section-title" id="upcoming-heading">
                  <span class="well well-soft" aria-hidden="true"><svg class="icon"><use href="#i-calendar" /></svg></span>Upcoming
                </h2>
                <span class="section-note">Accepted orders</span>
              </div>
              <div class="panel">
                <ul class="rows scroll-list" id="upcoming-list" tabindex="0" aria-labelledby="upcoming-heading"></ul>
              </div>
            </section>

            <section aria-labelledby="requests-heading" data-tone="saffron">
              <div class="section-head">
                <h2 class="section-title" id="requests-heading">
                  <span class="well well-soft" aria-hidden="true"><svg class="icon"><use href="#i-chat" /></svg></span>Pending requests
                </h2>
                <span class="section-meta">
                  <span class="section-note">All dates</span>
                  <span class="badge" id="requests-count">0</span>
                </span>
              </div>
              <div class="panel">
                <ul class="rows scroll-list" id="request-list" tabindex="0" aria-labelledby="requests-heading"></ul>
              </div>
            </section>
          </div>

          <section aria-labelledby="menu-heading" data-tone="basil">
            <div class="section-head">
              <h2 class="section-title" id="menu-heading">
                <span class="well well-soft" aria-hidden="true"><svg class="icon"><use href="#i-utensils" /></svg></span>Menu for the week
              </h2>
              <span class="section-note" id="menu-range"></span>
            </div>
            <ol class="menu" id="menu-list" aria-labelledby="menu-heading"></ol>
          </section>
        </div>

        <section class="view detail" id="detail-view" aria-labelledby="detail-title" hidden>
          <div class="detail-head">
            <a class="back-link" href="#home">
              <svg class="icon" aria-hidden="true"><use href="#i-left" /></svg>Dashboard
            </a>
            <h2 class="detail-title" id="detail-title"></h2>
          </div>
          <div id="detail-body"></div>
        </section>
      </div>
    </main>

    <footer class="footer" id="footer" hidden>
      <p>Updates automatically every 30 seconds</p>
    </footer>
  </body>
</html>
